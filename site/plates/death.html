<section class="plate" id="death">
  <div class="plate-h">
    <div class="row"><p class="eyebrow">How a face dies</p><span class="st st-meas">measured, re-checked</span></div>
    <h2>A face does not erode. It is busy, and ten generations later it is gone.</h2>
  </div>
  <div class="figs">
    <figure class="fig c7 panel">
      <h3>Three faces of that run, their last 300 generations</h3>
      <div id="f-closeup"></div>
      <figcaption>Live cells in the face layer. Nothing announces the end.</figcaption>
    </figure>
    <figure class="fig c5 panel">
      <h3>One face, mid-life</h3>
      <div id="f-kagome"></div>
      <figcaption>A face is a triangle of kagome lattice: here 63 sites, 38 alive. Its <b>area</b> is the number of sites.</figcaption>
    </figure>
  </div>
  <div class="figs">
    <figure class="fig c7 panel">
      <h3>How often a face of 45 sites holds k live cells</h3>
      <div id="f-tail"></div>
      <figcaption>On the low side the odds fall in a straight line down to one cell: each cell fewer is about two-thirds as likely. <b>The death rate is the line's next point.</b> Dying is the far end of ordinary jitter.</figcaption>
    </figure>
    <figure class="fig c5 panel nostretch">
      <div class="nums" style="grid-template-columns:1fr 1fr">
        <div class="num"><span class="v">63%</span><span class="l">of faces die from one last cell</span></div>
        <div class="num"><span class="v">23% · 9%</span><span class="l">from two, from three</span></div>
      </div>
      <div id="f-ember"></div>
      <figcaption>The usual three-cell remnant, the last ember: three faces round one corner of a cube.</figcaption>
    </figure>
  </div>
</section>
