<section class="plate" id="sym">
  <div class="plate-h">
    <div class="row"><p class="eyebrow">Symmetry <b>· corrected</b></p><span class="st st-meas">edge ladder: two codes</span><span class="st st-proved">the reduction: proved</span><span class="st st-open">mechanism: conjecture</span><span class="st st-open">√A term: not shown asymptotic</span></div>
    <h2>Symmetry is fatal mainly because it makes faces that share an edge die together. Each such edge costs about the same.</h2>
  </div>
  <div class="figs">
    <figure class="fig c7 panel">
      <h3>One vessel of 63-site faces, symmetry added one edge at a time</h3>
      <div id="f-ladder"></div>
      <div class="keys"><span class="key"><span class="sw dot" style="background:var(--s1)"></span>the theory line’s stepper, on the reduced system</span><span class="key"><span class="sw dot" style="background:var(--surface);border:2px solid var(--ink)"></span>the review’s own stepper, on the full system</span><span class="key"><span class="sw dot" style="background:var(--s3)"></span>inversion: pairs faces that share no edge</span></div>
      <div id="t-ladder"></div>
      <figcaption>Each coordinate mirror ties one edge of every face to the neighbour across it, which must then die at the same moment. Four steps down, about <b>2.15</b> each in ln(wait), adding up; inversion, which pairs faces sharing no edge, costs at most about 0.1. A twofold rotation costs about as much on the edge-sharing faces it pairs: no mirror is needed.</figcaption>
    </figure>
    <figure class="fig c5 panel">
      <h3>What was said, and what stands</h3>
      <div class="was"><span class="lab">Said since 12 November</span><p>Six lockstep copies of a face, less a penalty along the mirror lines, where the chaos runs thin.</p></div>
      <div class="was now"><span class="lab">Now (corrected, not reversed)</span><p>The cost is mainly that edge-sharing faces die together. A mirror or threefold axis on a face with no rim <b>lengthens</b> its life, which the line had forecast to fall. In a fully symmetric face the tied rim lies on a mirror, so the two cannot be separated there: a mirror share of up to about a third of the √A term is not excluded.</p></div>
      <p class="cap">Why tied faces die sooner (they cannot hold each other up) is a conjecture: nobody has looked at the dying faces.</p>
    </figure>
  </div>
  <div class="nums" id="n-ladder"></div>
  <div class="figs">
    <figure class="fig c7 panel">
      <h3>Faces of fully symmetric soups</h3>
      <div id="f-sym"></div>
      <div class="keys"><span class="key"><span class="sw dot" style="background:var(--s2)"></span>centred on a cube (odd cubes)</span><span class="key"><span class="sw dot" style="background:var(--surface);border:2px solid var(--s2)"></span>centred on a vertex (even cubes): tougher, by an amount that changes with size</span><span class="key"><span class="sw line" style="background:var(--ink-3)"></span>fit: one sixth of the asymmetric price, less a √A term</span></div>
      <div id="t-sym"></div>
      <figcaption>A symmetric state is 48 copies of one region in lockstep, and that is exact: it runs as gump on the orbits. By the law above, an <b>asymmetric</b> face of 459 sites would last about 10⁴¹ generations (an extrapolation); the symmetric one lasts 260,000. The fit’s √A coefficient, −0.196, moves with the price assumed for an asymmetric site (−0.127 if that price is pinned at 0.2035, the value measured on faces with diagonal mirrors); whether the term bends, so whether the form holds for large faces, is open.</figcaption>
    </figure>
    <figure class="fig c5 panel">
      <h3>Your closed cubes, side 8 to 16</h3>
      <div id="f-cubes"></div>
      <div class="keys"><span class="key"><span class="sw dot" style="background:var(--s2)"></span>lifetime</span><span class="key"><span class="sw" style="background:var(--ink-3);width:5px;height:12px"></span>forecast made beforehand</span></div>
      <figcaption>Side 16 was forecast at 240 million generations and lived <b>2,919,617,676</b>. Big symmetric faces are tougher than small ones suggested. Side 17 has not been run.</figcaption>
    </figure>
  </div>
</section>
