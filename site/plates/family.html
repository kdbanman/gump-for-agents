<section class="plate" id="family">
  <div class="plate-h">
    <div class="row"><p class="eyebrow">The family</p><span class="st st-proved">sealing: proved</span><span class="st st-meas">laws: measured</span><span class="st st-open">which rules boil: open</span></div>
    <h2>A gump is any rule whose seeds are sealed in by flat walls, burn, and lose a wall at a time.</h2>
  </div>
  <div class="figs">
    <figure class="fig c5 panel">
      <h3>What seals a wall</h3>
      <div id="f-halfspace"></div>
      <figcaption>The square is an empty cell just outside a cut; the dots are the most live cells it can see inside. Birth needs four. If no cell outside can see as many live cells inside as birth needs, the outside stays dead for good. That is a theorem about <b>the cut and where it sits</b>, not just its direction; the old statement had only directions and called the rule you meant unconfined.</figcaption>
    </figure>
    <figure class="fig c7 panel">
      <h3>Members found so far</h3>
      <div class="fam" id="f-fam"></div>
      <figcaption>Each “per cell” is the slope of ln(wait) for its own kind of wall, so the numbers are not exactly like with like. Whole-wall, memoryless death held in <span id="n-cases">42 of 50</span> lattice–rule pairs tested by a rule fixed in advance. Nothing yet predicts which rules boil, or how strong the law is.</figcaption>
    </figure>
  </div>
  <div class="figs">
    <figure class="fig c7 panel">
      <h3>bond10: walls that hold each other up</h3>
      <div class="bars" id="f-bond10"></div>
      <figcaption>Generations for a box of 4 × 4 × 4 cubes to lose a wall (log scale). The layer under a wall holds the edge rows of its four neighbouring walls, and those stay dense, so a wall cannot die while its neighbours live. Gump has a mild form of this (the 0.91 nats on the area-law page); why bond10’s is so strong is <b>not known</b>.</figcaption>
    </figure>
    <div class="fig c5">
      <div class="nums" style="grid-template-columns:1fr" id="n-family"></div>
    </div>
  </div>
</section>
