<section class="plate" id="thin">
  <div class="plate-h">
    <div class="row"><p class="eyebrow">The thinnest face</p><span class="st st-meas">measured, independent code</span><span class="st st-once">the limit: a spread of fitted forms</span><span class="st st-open">derived from the rule: no</span></div>
    <h2>A face one step around pays about 0.099 per cell in the long run: half a wide face’s price.</h2>
  </div>
  <div class="figs">
    <figure class="fig c7 panel">
      <h3>Price of one more cell, on a face one step around</h3>
      <div id="f-thin"></div>
      <div class="keys"><span class="key"><span class="sw" style="background:var(--s1);height:3px;width:14px"></span>ring faces, over each step of 12 cells</span><span class="key"><span class="sw" style="background:var(--s3);height:3px;width:14px"></span>a face with two free ends</span><span class="key"><span class="sw" style="background:var(--s-mute);opacity:.6"></span>long-face limit</span></div>
      <div id="t-thin"></div>
      <figcaption>The census’s 0.115 and 0.111 were the first two steps of a law that is still bending. A face cut open by a wall of dead sites pays a straight price. The shaded range is where the fitted forms land; it is <b>not</b> an error bar.</figcaption>
    </figure>
    <figure class="fig c5 panel">
      <h3>How it dies: an island shrinking from both ends</h3>
      <div id="f-island"></div>
      <figcaption>Mean live cells on a thin ring face, looking back from its death (the line’s numbers; the review’s own code agrees, see Numbers). Centring the bars is a picture of what was measured: the live part shrinks from both ends, over a time proportional to its length.</figcaption>
    </figure>
