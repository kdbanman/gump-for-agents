<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gump</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<aside id="panel">
  <header><b>gump</b> <span class="dim">faces of the cubic honeycomb · B45/S345</span></header>

  <section id="readout">
    <div class="big"><span class="lbl">generation</span> <span id="gen">0</span></div>
    <div class="big"><span class="lbl">generations/s</span> <span id="gps">–</span></div>
    <div class="row dim"><span id="spf"></span><span id="fps"></span></div>
    <div class="big"><span class="lbl">population</span> <span id="pop">–</span></div>
    <div class="row orient">
      <span><i class="sw sx"></i>x <b id="popx">–</b></span>
      <span><i class="sw sy"></i>y <b id="popy">–</b></span>
      <span><i class="sw sz"></i>z <b id="popz">–</b></span>
    </div>
    <div class="dim" id="statsage"></div>
    <canvas id="strip" width="300" height="90"></canvas>
  </section>

  <section>
    <div class="buttons">
      <button id="play" title="space">▶ play</button>
      <button id="step" title="period / right arrow">step</button>
      <label>speed <select id="speed">
        <option value="1">1/s</option><option value="2">2/s</option><option value="5">5/s</option>
        <option value="10">10/s</option><option value="30">30/s</option><option value="60">60/s</option>
        <option value="200">200/s</option><option value="1000">1k/s</option><option value="max" selected>max</option>
      </select></label>
    </div>
  </section>

  <section>
    <h3>hull <span class="dim">layers s = d·p along body diagonals (only ever shrink)</span></h3>
    <table id="hull"></table>
    <div id="hullevents" class="events"></div>
  </section>

  <section>
    <h3>environment</h3>
    <div id="boxinfo"></div>
    <div id="edge" class="alert"></div>
    <div class="buttons">
      <input id="resizeN" size="9" placeholder="N or nx,ny,nz">
      <button id="resize" title="re-embed the current state, centred">resize</button>
      <button id="fit" title="smallest box holding the current hull forever">fit hull</button>
      <button id="bcToggle">⇄ torus</button>
    </div>
  </section>

  <section>
    <h3>seed</h3>
    <div class="form">
      <label>kind <select id="f-seed">
        <option value="cube">closed cube</option><option value="key">legacy key 1–9</option>
        <option value="soup">random soup</option><option value="legacy">legacy cube (H)</option><option value="cells">cell list</option>
      </select></label>
      <label data-for="cube soup">n <input id="f-n" type="number" min="1" max="200" value="11"></label>
      <label data-for="key">key <input id="f-k" type="number" min="1" max="9" value="5"></label>
      <label data-for="legacy">H <input id="f-H" type="number" min="4" max="400" value="60"></label>
      <label data-for="soup">shape <select id="f-shape"><option value="cube">cube</option><option value="oct">octahedron</option><option value="slab">{111} slab</option></select></label>
      <label data-for="soup">density <input id="f-density" type="number" min="0" max="1" step="0.05" value="0.3"></label>
      <label data-for="soup">layers <input id="f-layers" type="number" min="1" max="99" value="3"></label>
      <label data-for="cells" title="doubled coordinates x,y,z;x,y,z;… (exactly one odd)">cells <input id="f-cells" size="22"></label>
      <label data-for="soup">rng <input id="f-rng" type="number" min="0" value="1"></label>
      <label>box <input id="f-box" size="8" value="auto" title="auto, N, or nx,ny,nz (cubes)"></label>
      <label>boundary <select id="f-bc"><option value="dead">dead outside</option><option value="torus">torus</option></select></label>
    </div>
    <div class="buttons"><button id="apply">reset to seed</button><button id="share">copy link</button></div>
  </section>

  <section>
    <h3>view</h3>
    <div class="form">
      <label>render <select id="v-mode"><option value="raymarch">ray-march (DDA)</option><option value="instanced">instanced quads</option></select></label>
      <label>face size <input id="v-face" type="range" min="0.2" max="1" step="0.05" value="0.6"></label>
      <label><input id="v-border" type="checkbox" checked> face edges</label>
      <label><input id="v-hull" type="checkbox" checked> hull</label>
      <label><input id="v-box" type="checkbox" checked> box</label>
    </div>
  </section>
  <footer class="dim">space play · . step · 1–9 legacy keys · drag orbit · wheel zoom</footer>
</aside>
<script type="module" src="./src/main.js"></script>
</body>
</html>
