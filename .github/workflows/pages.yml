# GitHub Pages deployment for the gump web app (web/dist).
#
# Manual trigger only, on purpose: nothing is published until the repository owner
#   1. sets Settings -> Pages -> Build and deployment -> Source to "GitHub Actions", and
#   2. runs this workflow (Actions -> pages -> Run workflow).
# The site then appears at https://<owner>.github.io/<repo>/. To publish on every push to
# main instead, add  push: {branches: [main]}  under "on:".
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: node tools/build.mjs
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
